<!DOCTYPE html>
<html>
<head>
    <title>Student Portal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Student Portal</h1>
    <a href="/add">Add Student</a>
    <table>
        <tr><th>ID</th><th>Name</th><th>Age</th><th>Major</th><th>Actions</th></tr>
        {% for s in students %}
        <tr>
            <td>{{ s[0] }}</td>
            <td>{{ s[1] }}</td>
            <td>{{ s[2] }}</td>
            <td>{{ s[3] }}</td>
            <td>
                <a href="/edit/{{ s[0] }}">Edit</a> |
                <a href="/delete/{{ s[0] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
